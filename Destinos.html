  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0ea5e9;
      --accent-hover: #38bdf8;
      --card-border: rgba(255, 255, 255, 0.08);
      --map-filter: invert(90%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
zoom:75%;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section_1 {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section_1 h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section_1 p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Sistema de navegación / Filtros */
/* Nuevo Wrapper Maestro */
.premium-destinations-wrapper {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  margin-bottom: 3rem;
}

/* Contenedor protector con máscara difuminada Edge-to-Edge */
.dest-scroll-container {
  flex: 1;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 6%, #000 94%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0%, #000 6%, #000 94%, transparent 100%);
}

/* BARRA REESTRUCTURADA: Elimina flex-wrap para evitar distorsión vertical */
.destinations-nav {
  display: flex;
  gap: 0.85rem;
  overflow-x: auto;
  white-space: nowrap;
  padding: 0.5rem 2.2rem;
  scroll-behavior: smooth;
  width: 100%;
}

.destinations-nav::-webkit-scrollbar {
  display: none; /* Oculta barra nativa */
}

/* BOTÓN PROTEGIDO CONTRA COLAPSO */
.nav-btn {
  flex-shrink: 0; /* EVITA QUE LOS 30 BOTONES SE DEFORMEN */
  background: var(--bg-secondary);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 0.75rem 1.6rem;
  border-radius: 9999px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.25s ease;
}

.nav-btn:hover, .nav-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 4px 20px rgba(14, 165, 233, 0.35);
  color: #fff;
}

/* DISEÑO PREMIUM DE LAS FLECHAS MULTIMEDIA */
.dest-scroll-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  background: var(--bg-secondary);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 20;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
  opacity: 0;
  pointer-events: none;
}

.dest-scroll-arrow.visible {
  opacity: 1;
  pointer-events: auto;
}

.dest-scroll-arrow:hover {
  background: #fff;
  color: var(--bg-primary);
  border-color: #fff;
}

.dest-scroll-arrow svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

.arrow-left { left: 8px; }
.arrow-right { right: 8px; }

    /* Contenedor principal del Destino Activo */
    .destination-showcase {
      background: var(--bg-secondary);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      align-items: center;
      min-height: 500px;
    }

    @media (max-width: 768px) {
      .destination-showcase {
        grid-template-columns: 1fr;
        padding: 1.5rem;
      }
    }

    /* Detalles del destino */
    .dest-info h2 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: #fff;
    }

    .dest-tag {
      display: inline-block;
      background: rgba(14, 165, 233, 0.15);
      color: var(--accent);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(14, 165, 233, 0.3);
    }

    .dest-description {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .dest-specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .spec-item h4 {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .spec-item p {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Contenedor del mapa premium */
    .map-wrapper {
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .premium-map {
      width: 100%;
      height: 400px;
      border: 0;
      display: block;
      filter: var(--map-filter);
      transition: filter 0.5s ease;
    }
    /* Contenedor completo de la galería */
.dest-gallery-section {
  grid-column: 1 / -1; /* Hace que ocupe todo el ancho inferior en el grid principal */
  margin-top: 2.5rem;
  border-top: 1px solid var(--card-border);
  padding-top: 2rem;
}

.dest-gallery-section h3 {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 1.25rem;
  color: #fff;
  letter-spacing: -0.02em;
}

/* Grid de fotos responsivo */
.dest-gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.25rem;
}

/* Tarjetas individuales de imágenes premium */
.gallery-img-wrapper {
  overflow: hidden;
  border-radius: 14px;
  height: 160px;
  border: 1px solid var(--border-premium);
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.gallery-img-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  display: block;
}

/* Efecto Zoom Premium al pasar el cursor */
.gallery-img-wrapper:hover img {
  transform: scale(1.08);
}
    /* ==========================================================================
   SISTEMA LIGHTBOX PREMIUM (PANTALLA COMPLETA)
   ========================================================================== */
.lightbox-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(2, 6, 23, 0.85); /* Fondo oscuro profundo */
  backdrop-filter: blur(12px); /* Difuminado de fondo estilo Apple/SaaS */
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000; /* Asegura estar por encima del mapa y modales */
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.lightbox-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* Imagen expandida dentro del visor */
.lightbox-img {
  max-width: 85%;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  transform: scale(0.95);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.lightbox-overlay.active .lightbox-img {
  transform: scale(1);
}

/* Botón de cierre elegante */
.lightbox-close {
  position: absolute;
  top: 2rem; right: 2rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-main);
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.5rem;
  transition: all 0.2s ease;
}

.lightbox-close:hover {
  background: #ef4444;
  border-color: #ef4444;
  color: #fff;
  transform: rotate(90deg);
}

function renderDestination(key) {
  const data = destinations[key];
  const container = document.getElementById('destination-content');
  
  container.style.opacity = '0';
  
  setTimeout(() => {
    // 1. Generar los elementos HTML con el disparador 'openLightbox(this.src)' integrado en cada imagen
    let galleryHTML = '';
    if (data.gallery && data.gallery.length > 0) {
      let imagesHTML = '';
      
      for (let i = 0; i < data.gallery.length; i++) {
        let currentUrl = data.gallery[i];
        
        imagesHTML += [
          '<div class="gallery-img-wrapper">',
            // El atributo onclick="openLightbox(this.src)" detecta de inmediato qué foto se presionó
            '<img src="', currentUrl, '" crossorigin="anonymous" alt="Instalaciones Nexus" onclick="openLightbox(this.src)" style="cursor: pointer;" onerror="this.src=\'https://unsplash.com\'">',
          '</div>'
        ].join('');
      }

      galleryHTML = [
        '<div class="dest-gallery-section">',
          '<h3>Instalaciones y Entorno del Hub (Clic para expandir)</h3>',
          '<div class="dest-gallery-grid">',
            imagesHTML,
          '</div>',
        '</div>'
      ].join('');
    }

    // 2. Inyectar todo el conjunto estructural (Detalles + Mapa + Galería Inferior)
    container.innerHTML = [
      '<div class="dest-info">',
        '<span class="dest-tag">', data.tag, '</span>',
        '<h2>', data.title, '</h2>',
        '<p class="dest-description">', data.description, '</p>',
        '<div class="dest-specs">',
          '<div class="spec-item">',
            '<h4>Recinto Primario</h4>',
            '<p>', data.venue, '</p>',
          '</div>',
          '<div class="spec-item">',
            '<h4>Capacidad del Hub</h4>',
            '<p>', data.capacity, '</p>',
          '</div>',
        '</div>',
      '</div>',
      '<div class="map-wrapper">',
        '<iframe src="', data.mapUrl, '" class="premium-map" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>',
      '</div>',
      galleryHTML
    ].join('');
    
    container.style.opacity = '1';
  }, 200);
}

// ==========================================================================
// CONTROLADORES INTERACTIVOS DE PANTALLA COMPLETA (LIGHTBOX)
// ==========================================================================
function openLightbox(imageSrc) {
  const lightbox = document.getElementById('global-lightbox');
  const targetImg = document.getElementById('lightbox-target-img');
  
  // Asignar la ruta de la imagen seleccionada al visor gigante
  targetImg.src = imageSrc;
  
  // Activar contenedor con animaciones fluidas
  lightbox.classList.add('active');
}

function forceCloseLightbox() {
  document.getElementById('global-lightbox').classList.remove('active');
}

function closeLightbox(e) {
  // Permite cerrar la pantalla completa al dar clic en las zonas vacías del fondo
  if (e.target.classList.contains('lightbox-overlay')) {
    forceCloseLightbox();
  }
}
// Controlador del cambio de pestañas con centrado inteligente
function switchDestination(key, button) {
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  button.classList.add('active');
  
  // Centrar automáticamente el botón en móviles al dar clic
  button.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  
  renderDestination(key);
}

// Carga inicial y listeners del carrusel de flechas
const destNavBar = document.getElementById('destinations-nav-bar');
const destArrowLeft = document.getElementById('dest-arrow-left');
const destArrowRight = document.getElementById('dest-arrow-right');

function slideDestinations(direction) {
  const offsetWidth = destNavBar.clientWidth * 0.65;
  if (direction === 'left') {
    destNavBar.scrollLeft -= offsetWidth;
  } else {
    destNavBar.scrollLeft += offsetWidth;
  }
}

function checkDestArrows() {
  const currentScroll = destNavBar.scrollLeft;
  const maximumScroll = destNavBar.scrollWidth - destNavBar.clientWidth;

  if (currentScroll > 6) {
    destArrowLeft.classList.add('visible');
  } else {
    destArrowLeft.classList.remove('visible');
  }

  if (currentScroll < maximumScroll - 6) {
    destArrowRight.classList.add('visible');
  } else {
    destArrowRight.classList.remove('visible');
  }
}

destNavBar.addEventListener('scroll', checkDestArrows);
window.addEventListener('resize', checkDestArrows);

// Carga inicial unificada
window.onload = () => {
  renderDestination('cdmx');
  setTimeout(checkDestArrows, 400);
};
