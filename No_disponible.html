    <h1>Destino no disponible</h1>

    <!-- Botón con navegación histórica por JS -->

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0ea5e9;
      --accent-hover: #38bdf8;
      --card-border: rgba(255, 255, 255, 0.08);
      --danger-glow: rgba(239, 68, 68, 0.2);
    }

    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow: hidden;
      position: relative;
    }

    /* Fondo abstracto premium */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
      top: 10%;
      left: 15%;
      z-index: 0;
    }

    .error-container {
      max-width: 550px;
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      z-index: 1;
      position: relative;
    }

    /* Icono de radar / Alerta animada */
    .icon-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--danger-glow);
      border-radius: 50%;
      animation: pulse 2s infinite ease-in-out;
    }

    .icon-box {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    .icon-box svg {
      width: 32px;
      height: 32px;
      fill: #ef4444;
    }

    /* Tipografía */
    .status-code {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ef4444;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      color: #fff;
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    /* Botón Premium de Retorno */
    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.3);
    }

    .btn-action:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(14, 165, 233, 0.5);
    }

    .btn-action svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .btn-action:hover svg {
      transform: translateX(-4px);
    }

    /* Animaciones */
    @keyframes pulse {
      0% {
        transform: scale(0.9);
        opacity: 1;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .error-container {
        padding: 2.5rem 1.5rem;
      }
      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
  <script>
    // Función de navegación inteligente
    function goBack(event) {
      event.preventDefault();
      // Si hay historial previo, regresa. Si no, redirige a la cartelera principal por defecto
      if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = '/Cartelera_eventos';
      }
    }
  </script>
