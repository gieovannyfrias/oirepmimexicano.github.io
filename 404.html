<body>

  <!-- Tarjeta Holográfica Interactiva -->
  <div class="hologram-card" id="card">
    <div class="premium-badge">
      <span></span> Sistema Buscando........
    </div>
    
    <div class="giant-code">404</div>
    
    <h1>Oirepmi mexicano no localizado</h1>
    <p>Has ingresado a una coordenada fuera de los límites de nuestra infraestructura en la nube. El nodo corporativo que buscas se encuentra desconectado.</p>

    <!-- Botón de salto de interfaz -->

      </svg>
    </a>
  </div>

  <style>
    :root {
      --bg-deep: #030014;
      --neon-cyan: #00f2fe;
      --neon-purple: #4facfe;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --glass-border: rgba(255, 255, 255, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      perspective: 1000px;
    }

    /* Fondo de estrellas animadas en CSS Puro */
    .space-background {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      z-index: 0;
    }

    .stars {
      position: absolute;
      width: 2px; height: 2px;
      background: transparent;
      box-shadow: 10vw 20vh #fff, 50vw 40vh #fff, 75vw 15vh #fff, 85vw 70vh #fff, 25vw 80vh #fff, 60vw 90vh #fff, 90vw 30vh #fff, 35vw 10vh #fff;
      animation: animStars 150s linear infinite;
    }

    /* Contenedor Holográfico Flotante */
    .hologram-card {
      background: rgba(10, 10, 20, 0.4);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 5rem 3.5rem;
      text-align: center;
      max-width: 650px;
      width: 90%;
      z-index: 2;
      box-shadow: 0 0 50px rgba(0, 242, 254, 0.05), inset 0 0 30px rgba(255, 255, 255, 0.02);
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.25, 0.61, 0.355, 1);
    }

    /* Número 404 Estilo Glitch de Luz */
    .giant-code {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #fff 0%, var(--neon-cyan) 50%, var(--neon-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.05em;
      position: relative;
      animation: float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.3));
    }

    .premium-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(90deg, rgba(0,242,254,0.1), rgba(79,172,254,0.1));
      color: var(--neon-cyan);
      border: 1px solid rgba(0, 242, 254, 0.2);
      padding: 0.5rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 2rem;
    }

    .premium-badge span {
      width: 6px; height: 6px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-cyan);
      animation: blink 1.5s infinite;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1.2rem;
      color: #fff;
    }

    p {
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 3rem;
    }

    /* Botón Hiper-Premium */
    .btn-warp {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      background: #fff;
      color: var(--bg-deep);
      padding: 1.1rem 2.5rem;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-warp:hover {
      background: var(--neon-cyan);
      color: var(--bg-deep);
      box-shadow: 0 15px 35px rgba(0, 242, 254, 0.4);
      transform: translateY(-3px) scale(1.02);
    }

    .btn-warp svg {
      width: 20px; height: 20px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .btn-warp:hover svg {
      transform: translateX(5px);
    }

    /* Animaciones complejas en CSS */
    @keyframes animStars {
      from { transform: translateY(0px); }
      to { transform: translateY(-2000px); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    @media (max-width: 480px) {
      .hologram-card { padding: 3rem 1.5rem; }
      .giant-code { font-size: 5.5rem; }
      h1 { font-size: 1.7rem; }
    }
  </style>
  <script>
    // Efecto interactivo 3D Paralaje controlado por giroscopio del mouse
    const card = document.getElementById('card');
    
    document.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      
      card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // Suavizado cuando el mouse sale de la pantalla
    document.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });
  </script>

</body>
